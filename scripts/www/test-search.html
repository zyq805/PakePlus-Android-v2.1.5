<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0F172A;
            color: #F8FAFC;
            font-family: Arial, sans-serif;
        }
        .input-field {
            background: #1E293B;
            border: 2px solid #475569;
            border-radius: 8px;
            padding: 12px;
            color: #F8FAFC;
            width: 100%;
        }
        .suggestions-container {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1E293B;
            border: 1px solid #475569;
            border-radius: 8px;
            margin-top: 4px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .suggestion-item {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #334155;
        }
        .suggestion-item:hover {
            background: #334155;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-6">搜索测试</h1>
        
        <div class="mb-4 relative">
            <input type="text" id="test-search" class="input-field" placeholder="输入关键词搜索...">
            <div id="test-suggestions" class="suggestions-container"></div>
        </div>
        
        <div id="result" class="mt-4"></div>
    </div>

    <script>
        // 测试数据
        const testData = [
            { name: '微星 MPG B850I EDGE WIFI', price: 2099 },
            { name: '微星 MAG B850 TOMAHAWK WIFI', price: 1799 },
            { name: '技嘉 B850I AORUS ULTRA', price: 1999 },
            { name: '技嘉 B850 AORUS ELITE AX', price: 1699 },
            { name: '华硕 ROG STRIX B850E-E GAMING WIFI', price: 2299 },
            { name: '华硕 TUF GAMING B850M-PLUS WIFI', price: 1499 },
            { name: '精粤 B850I PRO', price: 999 }
        ];

        const searchInput = document.getElementById('test-search');
        const suggestionsContainer = document.getElementById('test-suggestions');
        const resultDiv = document.getElementById('result');

        searchInput.addEventListener('input', (e) => {
            const input = e.target.value.toLowerCase();
            const suggestions = testData.filter(item => 
                item.name.toLowerCase().includes(input)
            );
            
            showSuggestions(suggestions);
        });

        searchInput.addEventListener('focus', (e) => {
            if (e.target.value.trim()) {
                const input = e.target.value.toLowerCase();
                const suggestions = testData.filter(item => 
                    item.name.toLowerCase().includes(input)
                );
                showSuggestions(suggestions);
            }
        });

        searchInput.addEventListener('blur', () => {
            setTimeout(() => {
                suggestionsContainer.style.display = 'none';
            }, 200);
        });

        function showSuggestions(suggestions) {
            suggestionsContainer.innerHTML = '';
            
            // 添加自定义选项
            const customOption = document.createElement('div');
            customOption.className = 'suggestion-item border-b border-gray-600';
            customOption.textContent = '添加自定义型号';
            customOption.onclick = () => {
                resultDiv.textContent = '点击了：添加自定义型号';
                suggestionsContainer.style.display = 'none';
                searchInput.value = '';
            };
            suggestionsContainer.appendChild(customOption);

            // 添加搜索结果
            suggestions.forEach(item => {
                const suggestionItem = document.createElement('div');
                suggestionItem.className = 'suggestion-item';
                suggestionItem.innerHTML = `
                    <div class="font-medium">${item.name}</div>
                    <div class="text-sm text-gray-400">${item.price}元</div>
                `;
                suggestionItem.onclick = () => {
                    resultDiv.textContent = `选择了：${item.name} - ${item.price}元`;
                    suggestionsContainer.style.display = 'none';
                    searchInput.value = '';
                };
                suggestionsContainer.appendChild(suggestionItem);
            });

            suggestionsContainer.style.display = 'block';
        }
    </script>
</body>
</html>
